# The gate on the way in: format-clean (swift-format changes nothing) and a
# release build with 0 warnings. A version is a tag, cut by hand after this
# is green; nothing here touches a secret.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run check
      - run: git diff --exit-code
