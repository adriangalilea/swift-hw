# The gate on the way in: format-clean (swift-format changes nothing) and a
# release build with 0 warnings. A version is a tag, cut by hand after this
# is green; nothing here touches a secret.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: adriangalilea/ci/.github/workflows/mise.yml@e46001ace22a41eec718217045df254cc9fb54cd # v1.4.0
    permissions:
      contents: read
